<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a237e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cabinet Check">
<title>Cabinet Check</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<style>
  :root{
    --navy:#1a237e; --navy-d:#11164f; --blue:#1565c0;
    --green:#2e7d32; --green-bg:#e8f5e9; --green-soft:#f1f8f2; --green-line:#a6d7ad;
    --amber:#b8791a; --amber-bg:#fff5e6; --amber-line:#f0cd8f;
    --red:#c0392b; --red-bg:#fdecea; --red-line:#f0b7b0;
    --page:#eef0f4; --card:#fff; --line:#d3d7e2; --line-soft:#e6e9f2;
    --ink:#1a1a1a; --muted:#6b6f80; --dim:#9aa0b0;
    --sys:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overscroll-behavior:none}
  body{ font-family:var(--sys); font-size:16px; color:var(--ink); background:var(--page);
    display:flex; flex-direction:column; height:100vh; height:100dvh; overflow:hidden; -webkit-font-smoothing:antialiased; }
  button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:0;cursor:pointer}
  input,textarea,select{font-family:inherit;font-size:16px;color:inherit}

  header{ background:var(--navy); color:#fff; flex:none; padding-top:env(safe-area-inset-top); box-shadow:0 2px 8px rgba(10,20,60,.25); z-index:10; }
  .hdr-top{ display:flex; align-items:center; justify-content:space-between; padding:10px 14px 8px; }
  .brand{ font-size:17px; font-weight:800; letter-spacing:.5px; text-transform:uppercase; }
  .brand small{ display:block; font-size:10px; font-weight:600; letter-spacing:1px; color:#aeb8de; margin-top:1px; }
  .seg{ display:flex; background:rgba(255,255,255,.14); border-radius:9px; padding:3px; }
  .seg button{ font-size:12.5px; font-weight:700; padding:6px 10px; border-radius:7px; color:#cfd5ee; }
  .seg button.active{ background:#fff; color:var(--navy); }
  .hdr-sub{ display:flex; align-items:center; justify-content:space-between; padding:0 14px 9px; gap:10px; }
  .meta-sum{ font-size:12.5px; color:#cfd5ee; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .live{ font-size:10px; font-weight:800; letter-spacing:.5px; text-transform:uppercase; padding:3px 8px; border-radius:20px; background:rgba(255,255,255,.15); color:#cfd5ee; display:inline-flex; align-items:center; gap:5px; }
  .live::before{ content:""; width:7px; height:7px; border-radius:50%; background:#9aa0b0; }
  .live.on{ background:rgba(143,211,166,.22); color:#c9f0d4; } .live.on::before{ background:#8fd3a6; }
  .overall{ font-size:13px; font-weight:800; color:#f0e0c4; flex:none; }
  .pbar{ height:5px; background:rgba(255,255,255,.16); }
  .pfill{ height:100%; width:0; background:linear-gradient(90deg,#aeb8de,#fff); transition:width .25s ease; }
  .save-banner{ flex:none; background:#c0392b; color:#fff; font-size:13px; font-weight:700; text-align:center; padding:9px 14px; line-height:1.35; }

  main{ flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:12px 12px 18px; }

  .card{ background:var(--card); border-radius:14px; box-shadow:0 1px 6px rgba(20,30,70,.10); overflow:hidden; }
  .card-hd{ background:var(--navy); color:#fff; padding:14px 16px; display:flex; align-items:center; gap:12px; }
  .card-hd.att{ background:#8a5a12; }
  .card-hd.good{ background:var(--green); } .card-hd.good .g-meta{ color:#d5f0dc; }
  .card-hd.none{ background:#5b6472; } .card-hd.none .g-meta{ color:#d5d8de; }
  .status-row{ display:flex; gap:9px; padding:12px 14px 0; }
  .statbtn{ flex:1; padding:13px 8px; border-radius:11px; font-weight:800; font-size:14.5px; border:1.5px solid var(--line); background:#fff; color:var(--muted); }
  .statbtn.sg.on{ background:var(--green); border-color:var(--green); color:#fff; }
  .statbtn.sn.on{ background:#5b6472; border-color:#5b6472; color:#fff; }
  .g-code{ font-size:32px; font-weight:800; letter-spacing:.5px; line-height:1; }
  .g-meta{ flex:1; font-size:12.5px; color:#cfd5ee; line-height:1.35; font-weight:600; }
  .card-hd.att .g-meta{ color:#f0e0c4; }
  .g-chip{ flex:none; font-size:12px; font-weight:800; background:rgba(255,255,255,.18); padding:6px 11px; border-radius:20px; text-align:center; line-height:1.2; }

  .hint-line{ font-size:13px; color:var(--muted); font-weight:600; padding:11px 14px 4px; display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .hint-line b{ color:var(--red); }
  .rbtn{ font-size:12.5px; font-weight:800; color:var(--navy); background:#eef0f7; border-radius:20px; padding:7px 13px; flex:none; }
  .rbtn.on{ background:var(--navy); color:#fff; }
  .rbanner{ font-size:12.5px; color:var(--amber); font-weight:700; }

  .items{ padding:4px 10px 4px; }
  .item{ margin:6px 0; border:1.5px solid var(--line); border-radius:11px; background:#fff; overflow:hidden; }
  .item.low{ border-color:var(--red-line); }
  .ihead{ display:flex; align-items:center; justify-content:space-between; gap:10px; min-height:54px; padding:8px 12px; user-select:none; }
  .item.low .ihead{ background:var(--red-bg); }
  .i-name{ font-size:16.5px; font-weight:600; }
  .i-name em{ font-style:normal; font-size:11.5px; font-weight:700; color:var(--dim); display:block; margin-top:1px; }
  .item.low .i-name{ color:var(--red); }
  .i-par{ font-size:11px; font-weight:700; color:var(--blue); margin-left:auto; }
  .tag{ flex:none; font-size:12px; font-weight:800; color:var(--dim); letter-spacing:.5px; }
  .item.low .tag{ color:var(--red); }
  .box{ flex:none; width:28px; height:28px; border:2px solid #c4c8d6; border-radius:8px; display:grid; place-items:center; font-size:18px; font-weight:800; color:transparent; }
  .item.low .box{ background:var(--red); border-color:var(--red); color:#fff; }
  .ibody{ padding:4px 12px 12px; border-top:1px dashed var(--red-line); background:#fffafa; }
  .subrow{ display:flex; align-items:center; gap:9px; margin-top:10px; flex-wrap:wrap; }
  .subl{ font-size:12.5px; font-weight:700; color:var(--muted); }
  .qtylab{ font-size:14px; font-weight:600; display:flex; align-items:center; gap:9px; }
  .qtyinput{ width:74px; border:1.5px solid var(--line); border-radius:9px; padding:9px 10px; text-align:center; font-weight:700; }
  .qtyinput:focus{ outline:none; border-color:var(--blue); }
  .stepper{ display:inline-flex; align-items:stretch; border:1.5px solid var(--line); border-radius:9px; overflow:hidden; }
  .stepper .qtyinput{ width:54px; border:none; border-left:1.5px solid var(--line); border-right:1.5px solid var(--line); border-radius:0; }
  .qbtn{ width:44px; min-height:42px; font-size:23px; font-weight:800; color:var(--navy); background:#eef0f7; line-height:1; display:flex; align-items:center; justify-content:center; user-select:none; }
  .qbtn:active{ background:#dfe3ef; }
  .of{ font-size:13px; font-weight:700; color:var(--muted); }
  .chips2{ display:flex; gap:7px; flex-wrap:wrap; }
  .szc{ min-width:46px; padding:9px 4px; border:1.5px solid var(--line); border-radius:9px; font-weight:800; color:var(--muted); }
  .szc.on{ background:var(--red); border-color:var(--red); color:#fff; }
  .partc{ padding:9px 12px; border:1.5px solid var(--line); border-radius:9px; font-weight:700; font-size:13.5px; color:var(--muted); }
  .partc.on{ background:var(--red); border-color:var(--red); color:#fff; }
  .holderc{ padding:9px 15px; border:1.5px solid var(--line); border-radius:9px; font-weight:800; color:var(--muted); }
  .holderc.on-ok{ background:var(--green); border-color:var(--green); color:#fff; }
  .holderc.on-bad{ background:var(--red); border-color:var(--red); color:#fff; }

  .chips-wrap{ padding:10px 14px 4px; }
  .chips-l{ font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.7px; color:var(--muted); margin-bottom:7px; }
  .qchips{ display:flex; flex-wrap:wrap; gap:8px; }
  .qchip{ font-size:13.5px; font-weight:700; padding:8px 14px; border:1.5px solid var(--line); border-radius:20px; color:var(--muted); background:#fff; }
  .qchip.on{ background:var(--amber-bg); border-color:var(--amber-line); color:var(--amber); }
  .note-wrap{ padding:8px 14px 16px; }
  .note-wrap input{ width:100%; border:1.5px solid var(--line); border-radius:11px; padding:11px 12px; }
  .note-wrap input:focus{ outline:none; border-color:var(--blue); background:#fffdf5; }

  .ritem{ display:flex; align-items:center; gap:8px; min-height:54px; padding:8px 10px; margin:6px 0; border:1.5px solid var(--line); border-radius:11px; background:#fff; touch-action:none; }
  .ritem.drag{ background:#eef4ff; border-color:var(--blue); box-shadow:0 6px 16px rgba(20,40,90,.20); }
  .rhandle{ font-size:19px; color:var(--dim); width:30px; text-align:center; }
  .rname{ flex:1; font-size:16px; font-weight:600; }
  .rmove{ display:flex; gap:5px; }
  .rmove button{ width:40px; height:40px; border:1.5px solid var(--line); border-radius:9px; font-size:14px; font-weight:800; color:var(--navy); }
  .rmove button:disabled{ opacity:.3; }

  .ov-card{ background:var(--card); border-radius:14px; box-shadow:0 1px 6px rgba(20,30,70,.08); padding:16px; margin-bottom:12px; }
  .ov-card h3{ font-size:12px; text-transform:uppercase; letter-spacing:1px; color:var(--navy); margin-bottom:12px; font-weight:800; }
  .field{ margin-bottom:12px; } .field:last-child{ margin-bottom:0; }
  .field label{ display:block; font-size:12px; font-weight:700; color:var(--muted); margin-bottom:5px; text-transform:uppercase; letter-spacing:.5px; }
  .field input{ width:100%; border:1.5px solid var(--line); border-radius:10px; padding:11px 12px; }
  .field input:focus{ outline:none; border-color:var(--blue); }
  .stats{ display:flex; gap:10px; }
  .stat{ flex:1; text-align:center; border-radius:12px; padding:12px 6px; border:1px solid var(--line-soft); }
  .stat.g{ background:var(--green-soft); border-color:var(--green-line); }
  .stat.a{ background:var(--amber-bg); border-color:var(--amber-line); }
  .stat.n{ background:#f2f4f8; }
  .stat .n{ font-size:26px; font-weight:800; color:var(--navy); line-height:1; }
  .stat .l{ font-size:11px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; margin-top:5px; }
  .fseg{ display:flex; background:#eef0f7; border-radius:10px; padding:3px; margin-bottom:14px; }
  .fseg button{ flex:1; font-size:13px; font-weight:700; padding:8px 4px; border-radius:8px; color:var(--muted); }
  .fseg button.active{ background:var(--navy); color:#fff; }
  .zone-blk{ margin-bottom:16px; }
  .zone-ttl{ display:flex; align-items:center; justify-content:space-between; font-size:13px; font-weight:800; color:var(--navy); text-transform:uppercase; letter-spacing:.6px; margin-bottom:8px; }
  .zone-ttl .van{ font-size:11px; font-weight:600; color:var(--muted); letter-spacing:0; text-transform:none; }
  .chips{ display:grid; grid-template-columns:repeat(auto-fill,minmax(66px,1fr)); gap:8px; }
  .chip{ border:1.5px solid var(--line); border-radius:11px; padding:9px 4px; text-align:center; background:#fff; }
  .chip .c{ font-size:15px; font-weight:800; color:var(--ink); }
  .chip .f{ font-size:10.5px; font-weight:700; color:var(--dim); margin-top:2px; }
  .chip.att{ background:var(--amber-bg); border-color:var(--amber-line); } .chip.att .c,.chip.att .f{ color:var(--amber); }
  .chip.good{ background:var(--green-bg); border-color:var(--green-line); } .chip.good .c,.chip.good .f{ color:var(--green); }
  .chip.none{ background:#eef0f2; border-color:#d3d7de; } .chip.none .c,.chip.none .f{ color:#5b6472; }
  .chip.here{ box-shadow:0 0 0 2.5px var(--blue); }
  .actions{ display:grid; grid-template-columns:1fr 1fr; gap:9px; }
  .actions button{ padding:12px 8px; border-radius:11px; font-weight:700; font-size:14px; border:1.5px solid var(--navy); color:var(--navy); background:#fff; }
  .actions button.solid{ background:var(--navy); color:#fff; }
  .actions button.danger{ border-color:#c0392b; color:#c0392b; }

  footer{ flex:none; display:flex; align-items:stretch; gap:10px; padding:10px 12px; padding-bottom:calc(10px + env(safe-area-inset-bottom));
    background:var(--card); border-top:1px solid var(--line-soft); box-shadow:0 -2px 10px rgba(20,30,70,.08); }
  .nav-prev{ flex:none; width:58px; background:#eef0f7; color:var(--navy); font-size:24px; font-weight:800; border-radius:12px; }
  .nav-prev:disabled{ opacity:.35; }
  .nav-primary{ flex:1; background:var(--navy); color:#fff; font-size:19px; font-weight:800; border-radius:12px; padding:16px; letter-spacing:.3px; box-shadow:0 2px 8px rgba(26,35,126,.3); }
  .nav-primary:active{ background:var(--navy-d); }

  .overlay{ position:fixed; inset:0; background:rgba(15,20,45,.55); display:none; align-items:center; justify-content:center; padding:20px; z-index:50; }
  .overlay.on{ display:flex; }
  .sheet{ background:#fff; border-radius:16px; width:100%; max-width:460px; max-height:80vh; overflow:auto; padding:18px; }
  .sheet h3{ font-size:15px; color:var(--navy); margin-bottom:10px; font-weight:800; }
  .sheet textarea{ width:100%; min-height:200px; font-size:13px; font-family:ui-monospace,monospace; border:1.5px solid var(--line); border-radius:10px; padding:10px; }
  .sheet .row{ display:flex; gap:9px; margin-top:12px; }
  .sheet .row button{ flex:1; padding:12px; border-radius:10px; font-weight:700; border:1.5px solid var(--navy); color:var(--navy); }
  .sheet .row button.solid{ background:var(--navy); color:#fff; }
  .su-meta{ font-size:13px; font-weight:700; color:var(--muted); margin-bottom:12px; }
  .su-tiles{ display:grid; grid-template-columns:1fr 1fr; gap:9px; }
  .su-tile{ text-align:center; border-radius:12px; padding:14px 6px; border:1px solid var(--line-soft); }
  .su-tile .n{ font-size:28px; font-weight:800; line-height:1; color:var(--navy); }
  .su-tile .l{ font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; color:var(--muted); margin-top:5px; }
  .su-tile.g{ background:var(--green-soft); border-color:var(--green-line); }
  .su-tile.a{ background:var(--amber-bg); border-color:var(--amber-line); }
  .su-tile.x{ background:#eef0f2; } .su-tile.u{ background:#f2f4f8; }
  .su-zrow{ display:flex; align-items:center; justify-content:space-between; padding:9px 2px; border-top:1px solid var(--line); }
  .su-zrow:first-child{ border-top:none; }
  .su-zname{ font-weight:800; color:var(--navy); font-size:14px; min-width:60px; }
  .su-zbar{ flex:1; height:8px; background:#eef0f4; border-radius:5px; margin:0 12px; overflow:hidden; }
  .su-zfill{ height:100%; background:var(--amber); }
  .su-zct{ font-size:13px; font-weight:800; color:var(--muted); min-width:56px; text-align:right; }
  .su-zct.hot{ color:var(--amber); }
  .su-item{ padding:9px 2px; border-top:1px solid var(--line); font-size:14px; }
  .su-item:first-child{ border-top:none; }
  .su-item b{ color:var(--navy); font-size:15px; }
  .su-item .d{ color:var(--muted); font-size:13px; margin-top:2px; }
  .su-hrow{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:11px 2px; border-top:1px solid var(--line); cursor:pointer; }
  .su-hrow:first-child{ border-top:none; }
  .su-hd{ font-weight:800; color:var(--navy); font-size:14px; }
  .su-hs{ font-size:12px; color:var(--muted); font-weight:600; display:block; margin-top:2px; }
  .su-hcount{ font-size:12.5px; font-weight:800; color:var(--amber); background:var(--amber-bg); border:1px solid var(--amber-line); border-radius:20px; padding:3px 10px; flex:none; }
  .su-empty{ color:var(--muted); font-size:13.5px; text-align:center; padding:12px; }

  [hidden]{ display:none !important; }
</style>
</head>
<body>

<header>
  <div class="hdr-top">
    <div class="brand">Cabinet Check<small>UGE · Concourse B/A</small></div>
    <div class="seg">
      <button data-view="check" class="active">Walk</button>
      <button data-view="over">Board</button>
      <button data-view="super">Super</button>
    </div>
  </div>
  <div class="hdr-sub">
    <span class="meta-sum" id="metaSum">Tap Overview to set date / shift</span>
    <span style="display:flex;align-items:center;gap:8px;flex:none"><span class="live" id="live">Offline</span><span class="overall" id="overall">0 flagged</span></span>
  </div>
  <div class="pbar"><div class="pfill" id="pfill"></div></div>
</header>

<div id="saveBanner" class="save-banner" hidden></div>

<main id="main">
  <section id="checkView"><div class="card" id="card"></div></section>
  <section id="overView" hidden>
    <div class="ov-card">
      <h3>Shift Info</h3>
      <div class="field"><label>Date</label><input id="mDate" type="text" placeholder="Jul 12"></div>
      <div class="field"><label>Shift</label><input id="mShift" type="text" placeholder="AM / PM / OVN"></div>
      <div class="field"><label>Checked by</label><input id="mBy" type="text" placeholder="Your name"></div>
    </div>
    <div class="ov-card">
      <h3>Progress</h3>
      <div class="stats">
        <div class="stat g"><div class="n" id="stGood">0</div><div class="l">Good</div></div>
        <div class="stat a"><div class="n" id="stFlag">0</div><div class="l">Needs restock</div></div>
        <div class="stat n"><div class="n" id="stNone">0</div><div class="l">No cabinet</div></div>
      </div>
    </div>
    <div class="ov-card">
      <div class="fseg" id="fseg">
        <button data-f="all" class="active">All</button>
        <button data-f="flag">Needs restock</button>
      </div>
      <div id="zoneList"></div>
    </div>
    <div class="ov-card">
      <h3>Shift</h3>
      <div class="actions" style="grid-template-columns:1fr">
        <button class="danger" id="btnReset">New shift (clear)</button>
      </div>
    </div>
  </section>

  <section id="superView" hidden>
    <div class="ov-card">
      <h3>Cabinet Status — Live</h3>
      <div class="su-meta" id="suMeta"></div>
      <div class="su-tiles">
        <div class="su-tile g"><div class="n" id="suGood">0</div><div class="l">Good</div></div>
        <div class="su-tile a"><div class="n" id="suFlag">0</div><div class="l">Restock</div></div>
        <div class="su-tile x"><div class="n" id="suNone">0</div><div class="l">No cab</div></div>
        <div class="su-tile u"><div class="n" id="suLeft">0</div><div class="l">Not checked</div></div>
      </div>
    </div>
    <div class="ov-card"><h3>By Zone</h3><div id="suZones"></div></div>
    <div class="ov-card"><h3>Needs Restock Now</h3><div id="suList"></div></div>
    <div class="ov-card">
      <h3>Shift Logs</h3>
      <div class="actions" style="grid-template-columns:1fr"><button class="solid" id="btnSaveLog">Save this shift to the log</button></div>
      <div id="suHistory" style="margin-top:12px"></div>
    </div>
  </section>
</main>

<footer id="nav">
  <button class="nav-prev" id="prevBtn">&#8249;</button>
  <button class="nav-primary" id="primaryBtn">Next &#9654;</button>
</footer>

<div class="overlay" id="overlay">
  <div class="sheet">
    <h3 id="mHead">Report</h3>
    <textarea id="mText" readonly></textarea>
    <div class="row"><button id="mSelect" class="solid">Select all</button><button id="mClose">Close</button></div>
  </div>
</div>

<script>
  /* ═══════════ items ═══════════ */
  const GLOVE_SIZES = ["S","M","L","XL"];
  const ITEMS = [
    { key:"gloves", label:"Gloves", sizes:true },
    { key:"prov",   label:"Provisions", parts:[
        {k:"headphones",label:"Headphones ×2"},{k:"flightdeck",label:"Flight Deck ×3"},
        {k:"lavbag",label:"Lav Bag"},{k:"blankets",label:"Blankets"} ] },
    { key:"holders", label:"Holders", parts:[
        {k:"basket",label:"Basket"},{k:"gloveholder",label:"Glove Holders"},{k:"dividers",label:"Dividers"} ] },
    { key:"bags",   label:"Bags", par:"2–6 rolls", qty:true },
    { key:"trash",  label:"Trash Bags", qty:true },
    { key:"wypall", label:"WypAlls", par:2, qty:true },

    wrap.querySelectorAll(".chip").forEach(c=>c.addEventListener("click",()=>{ go(INDEX[c.dataset.code]); setView("check"); })); }

  /* ═══════════ supervisor view + shift logs ═══════════ */
  function nowMs(){ try{ return Date.now(); }catch(e){ return 0; } }
  function todayStr(){ try{ return new Date().toISOString().slice(0,10); }catch(e){ return "log"; } }
  function fmtTime(ms){ if(!ms)return ""; try{ return new Date(ms).toLocaleString(undefined,{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}); }catch(e){ return ""; } }
  function summaryNow(){ let good=0,flag=0,none=0,left=0; for(const g of GATES){ const s=statOf(state.gates[g.code]); if(s==="good")good++; else if(s==="att")flag++; else if(s==="none")none++; else left++; } return {good,flag,none,left}; }
  function renderSuper(){
    const s=summaryNow();
    $("#suGood").textContent=s.good; $("#suFlag").textContent=s.flag; $("#suNone").textContent=s.none; $("#suLeft").textContent=s.left;
    const m=state.meta; $("#suMeta").textContent=[m.date||"—",m.shift,m.by].filter(Boolean).join(" · ")+(fbReady?"  ·  live":"  ·  offline");
    $("#suZones").innerHTML=ZONES.map(z=>{ const gs=GATES.filter(g=>g.zone===z.z), f=gs.filter(g=>statOf(state.gates[g.code])==="att").length, pct=gs.length?f/gs.length*100:0;
      return '<div class="su-zrow"><span class="su-zname">'+z.z+'</span><span class="su-zbar"><span class="su-zfill" style="width:'+pct+'%"></span></span><span class="su-zct '+(f?"hot":"")+'">'+f+' flag</span></div>'; }).join("");
    const flagged=GATES.filter(g=>statOf(state.gates[g.code])==="att");
    $("#suList").innerHTML=flagged.length?flagged.map(g=>{ const c=state.gates[g.code]||{}, low=lowLabelsFrom(c), tags=c.tags?Object.keys(c.tags):[], bits=[]; if(low.length)bits.push(low.join(", ")); if(tags.length)bits.push(tags.join(", ")); if(c.note)bits.push(c.note);
      return '<div class="su-item"><b>'+g.code+'</b> <span style="color:var(--muted);font-weight:600">'+g.zone+'</span><div class="d">'+(bits.join(" · ")||"flagged")+'</div></div>'; }).join(""):'<div class="su-empty">Nothing flagged right now.</div>';
    loadHistory();
  }
  function saveLog(){ if(!fbReady){ alert("Connect to the internet to save a shift log."); return; }
    const date=todayStr(), shift=state.meta.shift||"", id=(date+"_"+(shift||"shift")).replace(/[.#$\[\]\/\s]+/g,"-");
    const entry={ date, shift, by:state.meta.by||"", savedAt:nowMs(), summary:summaryNow(), gates:clean(state.gates) };
    try{ db.ref("history/"+id).set(entry).then(()=>{ flash($("#btnSaveLog"),"Saved ✓"); loadHistory(); }).catch(()=>alert("Couldn't save the log.")); }catch(e){ alert("Couldn't save the log."); }
  }
  function loadHistory(){ const box=$("#suHistory"); if(!box)return; if(!fbReady){ box.innerHTML='<div class="su-empty">Offline — logs load when connected.</div>'; return; }
    db.ref("history").once("value").then(sn=>renderHistory(sn.val()||{})).catch(()=>{ box.innerHTML='<div class="su-empty">Couldn\'t load logs.</div>'; }); }
  function renderHistory(obj){ const box=$("#suHistory"), ids=Object.keys(obj); if(!ids.length){ box.innerHTML='<div class="su-empty">No shift logs yet.</div>'; return; }
    ids.sort((a,b)=>((obj[b].savedAt||0)-(obj[a].savedAt||0)));
    box.innerHTML=ids.map(id=>{ const e=obj[id], fl=e.summary?e.summary.flag:0;
      return '<div class="su-hrow" data-id="'+id+'"><span><span class="su-hd">'+(e.date||id)+(e.shift?" · "+e.shift:"")+'</span><span class="su-hs">'+(e.by?e.by+" · ":"")+fmtTime(e.savedAt)+'</span></span><span class="su-hcount">'+fl+' flagged</span></div>'; }).join("");
    box.querySelectorAll(".su-hrow").forEach(r=>r.addEventListener("click",()=>showLogDetail(obj[r.dataset.id]))); }
  function showLogDetail(e){ if(!e)return; const L=[], s=e.summary||{};
    L.push((e.date||"")+(e.shift?"  "+e.shift:"")+(e.by?"  ·  "+e.by:"")); L.push("Good "+(s.good||0)+"  ·  Restock "+(s.flag||0)+"  ·  No cab "+(s.none||0)+"  ·  Not checked "+(s.left||0)); L.push(""); L.push("NEEDS RESTOCK:");
    const g=e.gates||{}; let any=false;
    GATES.forEach(gt=>{ const c=g[gt.code]; if(statOf(c)!=="att")return; any=true; const low=lowLabelsFrom(c), tags=c.tags?Object.keys(c.tags):[], bits=[]; if(low.length)bits.push("low: "+low.join(", ")); if(tags.length)bits.push(tags.join(", ")); if(c.note)bits.push("note: "+c.note); L.push("  "+gt.code+(bits.length?" — "+bits.join(" | "):"")); });
    if(!any)L.push("  none");
    showModal("Log — "+(e.date||"")+(e.shift?" "+e.shift:""), L.join("\n")); }
  $("#btnSaveLog").addEventListener("click",saveLog);

  /* ═══════════ meta ═══════════ */
  [["mDate","date"],["mShift","shift"],["mBy","by"]].forEach(([id,k])=>{ const el=$("#"+id); el.value=state.meta[k]||"";
    el.addEventListener("input",()=>{ state.meta[k]=el.value; if(!el.value)delete state.meta[k]; saveSoon(); pushMeta(); updateHeader(); }); });
  function syncMeta(){ [["mDate","date"],["mShift","shift"],["mBy","by"]].forEach(([id,k])=>{ const el=$("#"+id); if(el)el.value=state.meta[k]||""; }); }

  /* ═══════════ export / backup ═══════════ */
  function lowLabelsFrom(c){ if(!c||!c.low)return []; return orderedItems().filter(it=>it.key in c.low).map(it=>{ const d=c.low[it.key]||{}; let s=it.label; const ex=[];
    if(it.sizes&&d.sizes){ const sz=GLOVE_SIZES.filter(x=>d.sizes[x]); if(sz.length)ex.push(sz.join("/")); }
    if(it.parts&&d.parts){ const ps=it.parts.filter(p=>d.parts[p.k]).map(p=>p.label); if(ps.length)ex.push(ps.join(", ")); }
    if(it.qty&&d.qty!=null&&d.qty!=="")ex.push("need "+d.qty+(it.par!=null?"/"+it.par:""));
    if(it.holder&&d.holder)ex.push("holder "+d.holder);
    if(ex.length)s+=" ("+ex.join("; ")+")"; return s; }); }
  function lowLabels(code){ return lowLabelsFrom(gRead(code)); }
  function showModal(h,t){ $("#mHead").textContent=h; $("#mText").value=t; $("#overlay").classList.add("on"); }
  $("#mClose").addEventListener("click",()=>$("#overlay").classList.remove("on"));
  $("#mSelect").addEventListener("click",()=>{ const t=$("#mText"); t.focus(); t.select(); try{document.execCommand("copy");}catch(e){} });
  $("#overlay").addEventListener("click",e=>{ if(e.target.id==="overlay")$("#overlay").classList.remove("on"); });
  $("#btnReset").addEventListener("click",()=>{ if(!confirm("Start a new shift? This saves the current board to the log, then clears every cabinet"+(fbReady?" for EVERYONE on the live board":"")+". (Keeps date / shift / name.)"))return;
    if(fbReady && Object.keys(state.gates).length) saveLog(); // archive before clearing
    state.gates={}; saveLocal(); if(fbReady){ try{ db.ref("gates").remove(); }catch(e){} } renderCard(); updateHeader(); renderOverview(); });
  function flash(btn,txt){ const o=btn.textContent; btn.textContent=txt; setTimeout(()=>btn.textContent=o,1200); }

  /* ═══════════ boot ═══════════ */
  renderCard(); updateNav(); updateHeader(); initFirebase();
</script>
</body>
</html>
